# The binding core materialises for the Instance's "prometheus" entry,
# controlled by the Instance. __INSTANCE_UID__ is replaced with its UID.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringBinding
metadata:
  name: orders-prometheus-26264916
  labels:
    core.openeverest.io/instance: orders
    monitoring.openeverest.io/entry: prometheus
    monitoring.openeverest.io/destination: prom
    monitoring.openeverest.io/class: prometheus
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: orders
      uid: __INSTANCE_UID__
      controller: true
spec:
  instanceRef:
    name: orders
  destinationRef:
    kind: MonitoringDestination
    name: prom
  classRef:
    name: prometheus
  executionMode: ExtensionManaged
