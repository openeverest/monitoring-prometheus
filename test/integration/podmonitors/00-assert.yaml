# The chart's class, claimed by the controller.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: prometheus
spec:
  controllerName: openeverest.io/monitoring-prometheus
  extensionManaged:
    requires:
      metrics: true
status:
  (conditions[?type == 'Accepted']):
    - status: "True"
      reason: Accepted
