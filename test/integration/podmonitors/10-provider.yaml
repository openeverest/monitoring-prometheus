# The monitoring contract a provider declares. The controller reads only the
# sources the Instance publishes; the Provider is here for completeness.
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: monitoring-prometheus-it
spec:
  componentTypes:
    mongod:
      kind: mongodb
    cfg:
      kind: mongodb
    mongos:
      kind: mongodb
  monitoring:
    componentTypes:
      mongod:
        metrics: Exporter
      cfg:
        metrics: Exporter
      mongos:
        metrics: Exporter
