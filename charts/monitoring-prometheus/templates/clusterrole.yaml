{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-prometheus.fullname" . }}
  labels:
    {{- include "monitoring-prometheus.labels" . | nindent 4 }}
# A class controller reads the monitoring kinds and Instances and writes only
# monitoring status. It never writes Instances or reads Secrets.
rules:
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses, monitoringdestinations, monitoringbindings]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses/status, monitoringdestinations/status, monitoringbindings/status]
    verbs: [patch]
  - apiGroups: [core.openeverest.io]
    resources: [instances]
    verbs: [get, list, watch]
  # The objects rendered for each binding.
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors]
    verbs: [get, list, create, patch, delete]
{{- end }}
