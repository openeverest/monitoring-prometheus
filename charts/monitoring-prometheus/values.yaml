replicaCount: 1

image:
  repository: ghcr.io/openeverest/monitoring-prometheus
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  automountServiceAccountToken: true
  name: ""

rbac:
  create: true

# The MonitoringClass this chart installs. The class is cluster-scoped;
# destinations reference it by name. The controller claims every class whose
# controllerName is class.controllerName (--controller-name).
class:
  create: true
  name: prometheus
  controllerName: openeverest.io/monitoring-prometheus
  displayName: Prometheus (Prometheus Operator)

compatibility:
  acknowledge:
    # OpenEverest release on which to run this build although it does not
    # support it, such as 2.0.0. Empty: do not.
    coreVersion: ""

podAnnotations: {}
podLabels: {}

# Pod Security Standards "restricted". No fixed runAsUser/runAsGroup: the image
# declares USER 65532:65532, and OpenShift's restricted-v2 SCC assigns IDs from
# the namespace range and rejects fixed ones outside it.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: probes
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: probes
  initialDelaySeconds: 5
  periodSeconds: 10

leaderElection:
  enabled: true

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
